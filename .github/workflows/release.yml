name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and attach .vsix to GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vsce 4.x requires Node >= 22
          node-version: "22"

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build .vsix
        id: package
        run: |
          mkdir -p dist
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          FILE="${NAME}-${VERSION}.vsix"
          npx vsce package --out "dist/${FILE}"
          ls -l dist
          echo "vsix-path=dist/${FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error

      # To also publish to the Visual Studio Marketplace later, add a step that runs
      # `npx @vscode/vsce publish --packagePath <vsix>` with a VSCE_PAT secret.
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VSIX="${{ steps.package.outputs.vsix-path }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists - replacing the .vsix asset"
            gh release upload "${TAG}" "${VSIX}" --clobber
            gh release edit "${TAG}" --title "${TAG}" --verify-tag
          else
            gh release create "${TAG}" "${VSIX}" \
              --title "${TAG}" \
              --verify-tag \
              --generate-notes
          fi
