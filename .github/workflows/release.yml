name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Package the .vsix but skip the Marketplace publish"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vsce 4.x requires Node >= 22
          node-version: "22"

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build .vsix
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          npx vsce package --out "dist/${NAME}-${VERSION}.vsix"
          ls -l dist

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error

  publish:
    name: Publish to Marketplace
    needs: package
    if: github.event_name == 'push' || !inputs.dry-run
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write
    steps:
      - name: Verify marketplace credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "::error::Repository secret VSCE_PAT is not set"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Locate .vsix
        id: locate
        run: |
          VSIX="$(find dist -name '*.vsix' -print -quit)"
          if [ -z "${VSIX}" ]; then
            echo "::error::No .vsix found under dist/"
            exit 1
          fi
          echo "Found ${VSIX} ($(du -h "${VSIX}" | cut -f1))"
          echo "vsix-path=${VSIX}" >> "$GITHUB_OUTPUT"

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx --yes @vscode/vsce@4 publish \
            --packagePath "${{ steps.locate.outputs.vsix-path }}"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.locate.outputs.vsix-path }}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
